services:
  # Redis Broker for gopher-queue background task queue
  redis:
    image: redis:7-alpine
    container_name: pinggopher-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # PingGopher Application (All-in-One role by default)
  pinggopher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinggopher-app
    ports:
      - "8080:8080"
    environment:
      - ROLE=all
      - PORT=8080
      - DB_PATH=/app/data/pinggopher.db
      - REDIS_ADDR=redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET:-pinggopher-super-secret-key}
    volumes:
      - pinggopher-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pinggopher-data:
